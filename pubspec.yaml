name: hiveescape
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  audioplayers: ^6.8.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: true
  image_path_ios: "assets/icon/hive_escape_ios.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
